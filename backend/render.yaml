services:
  - type: web
    name: greentracer-backend
    env: docker
    plan: starter # Puppeteer requires at least “starter”
    region: frankfurt
    branch: main
    repo: https://github.com/SolRudd/carbon-web-analyzer
    dockerfilePath: ./backend/Dockerfile
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: CORS_ORIGIN
        value: "https://www.greentracer.org,https://greentracer.org"
      - key: PUPPETEER_EXECUTABLE_PATH
        value: "/usr/bin/chromium"
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: "true"
    # ← add this block to persist your SQLite database
    volumes:
      - type: disk
        name: results-data
        mountPath: /app/results.db

# and at the bottom of the file, declare your disk:
disks:
  - name: results-data
    sizeGb: 1
