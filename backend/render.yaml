services:
  - type: web
    name: greentracer-backend
    env: docker
    plan: free
    region: frankfurt
    branch: main
    repo: https://github.com/SolRudd/carbon-web-analyzer
    dockerfilePath: ./backend/Dockerfile
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: CORS_ORIGIN
        value: https://www.greentracer.org,https://greentracer.org
