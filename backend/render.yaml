# render.yaml

services:
  - type: web
    name: greentracer-backend
    env: docker # ← force Docker build
    region: frankfurt
    branch: main
    dockerfilePath: backend/Dockerfile
    buildContext: backend # ← tell Docker to use the backend/ folder
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: RESULTS_DB_PATH
        value: "/app/data/results.db"
    disks:
      - name: results-data
        mountPath: /app/data
