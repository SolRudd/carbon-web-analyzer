# render.yaml
disks:
  - name: results-data
    sizeGB: 1

services:
  - type: web
    name: greentracer-backend
    env: docker
    plan: starter # you already have this
    region: frankfurt
    branch: main
    repo: https://github.com/SolRudd/carbon-web-analyzer
    dockerfilePath: ./backend/Dockerfile
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: CORS_ORIGIN
        value: "https://www.greentracer.org,https://greentracer.org"
      - key: PUPPETEER_EXECUTABLE_PATH
        value: "/usr/bin/chromium"
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: "true"
    disks:
      - name: results-data
        mountPath: /app/results.db
