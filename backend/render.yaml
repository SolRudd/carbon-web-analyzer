services:
  - type: web
    name: greentracer-backend
    env: docker
    region: frankfurt
    branch: main
    dockerfilePath: backend/Dockerfile
    buildContext: backend
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # These are the correct variables for your Supabase backend
      - key: SUPABASE_URL
        fromEnvironmentVar: SECRET_SUPABASE_URL
      - key: SUPABASE_SERVICE_KEY
        fromEnvironmentVar: SECRET_SUPABASE_SERVICE_KEY
      - key: PAGESPEED_API_KEY
        fromEnvironmentVar: SECRET_PAGESPEED_API_KEY
