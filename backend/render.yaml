services:
  - type: web
    name: greentracer-backend
    env: docker
    region: frankfurt
    branch: main
    dockerfilePath: backend/Dockerfile
    buildContext: backend
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # THE FOLLOWING ARE CORRECT FOR YOUR SUPABASE BACKEND
      - key: SUPABASE_URL
        fromEnvironmentVar: SECRET_SUPABASE_URL # Use fromEnvironmentVar for secrets
      - key: SUPABASE_SERVICE_KEY
        fromEnvironmentVar: SECRET_SUPABASE_SERVICE_KEY
      - key: PAGESPEED_API_KEY
        fromEnvironmentVar: SECRET_PAGESPEED_API_KEY
      # NOTE: The old RESULTS_DB_PATH key has been removed as it is not needed.
      # NOTE: The old MASTER_API_KEY has been removed as it is not used in the code.

    # NOTE: The 'disks' section has been removed as it is only for file databases
    # and is not needed for Supabase.
